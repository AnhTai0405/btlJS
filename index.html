<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTIT Subject Rating</title>

    <link rel="stylesheet" href="trangtri.css">
</head>
<body>
    <div class="header-container">
        <a href="https://slink.ptit.edu.vn/dashboard"><img src="logoptit.png"
            alt="PTIT Logo"
            class="logo"
            width="50"
            height="50"
            title ="S-link"
            
        >
        </a>
       
        <span class="site-title">Học viện Công nghệ Bưu chính Viễn thông</span>
    </div>
  
    
       

    <!-- NAVBAR -->
    <nav>

        <h2>PTIT Subject Rating</h2> <br>
        
        <button id="darkModeBtn">
            🌙 Dark Mode
        </button>

    </nav>

    <!-- HEADER -->
    <header>

        <h1>Hệ thống đánh giá môn học PTIT</h1>

        <p>
            Review độ khó môn học dành cho sinh viên
        </p>

    </header>

    <!-- FORM -->
    <section class="form-section">

        <h2>Thêm đánh giá môn học</h2>

        <form id="subjectForm">

            <select id="subjectName">
                <option value="">
                    -- Chọn môn học --
                </option>

                <option value="Lập trình với ngôn ngữ script">
                    Lập trình với ngôn ngữ script
                </option>

                <option value="Tiếng anh Course 1">
                    Tiếng anh Course 1
                </option>

                <option value="Giải tích 2">
                    Giải tích 2
                </option>

                <option value="Cơ sở dữ liệu">
                    Cơ sở dữ liệu
                </option>

                <option value="Giáo dục thể chất 2">
                    Giáo dục thể chất 2
                </option>

                <option value="Xác suất thống kê">
                    Xác suất thống kê
                </option>



                
            </select>

            <select id="department">

                <option value="">
                    -- Chọn khoa --
                </option>

                <option value="CNTT">
                    CNTT
                </option>

                <option value="ATTT">
                    ATTT
                </option>

                <option value="Marketing">
                    Marketing
                </option>

            </select>

            <label>
                Độ khó:
                <span id="difficultyValue">5</span>
            </label>

            <input
                type="range"
                id="difficulty"
                min="1"
                max="10"
                value="5"
            >

            <select id="assignments">

                <option value="Ít">
                    Ít bài tập
                </option>

                <option value="Trung bình">
                    Trung bình
                </option>

                <option value="Nhiều">
                    Nhiều bài tập
                </option>

            </select>

            <select id="passLevel">

                <option value="Dễ">
                    Dễ qua môn
                </option>

                <option value="Trung bình">
                    Trung bình
                </option>

                <option value="Khó">
                    Khó qua môn
                </option>

            </select>

            <input
                type="text"
                id="prerequisite"
                placeholder="Môn cần học trước"
            >

            <textarea
                id="review"
                placeholder="Nhập review..."
            ></textarea>

            <button type="submit">
                Thêm đánh giá
            </button>

        </form>

        <p id="error"></p>

    </section>

    <!-- SEARCH -->
    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Tìm môn học..."
        >

        <select id="filterDifficulty">

            <option value="all">
                Tất cả độ khó
            </option>

            <option value="easy">
                Dễ (1-4)
            </option>

            <option value="medium">
                Trung bình (5-7)
            </option>

            <option value="hard">
                Khó (8-10)
            </option>

        </select>
        <a href="https://docs.google.com/spreadsheets/d/1NJ2bw_mYiWeiCtmd7y-fg5586NFFw4ahoJLF6W1w1l8/edit?usp=drivesdk&usp=embed_facebook">
            <button id="documentBtn">Tài liệu</button>
        </a>
      

    </section>

    <!-- TOP SUBJECT -->
    <section class="top-section">

        <h2>🔥 Top môn khó nhất</h2>

        <div id="topSubjects"></div>

    </section>

    <!-- SUBJECT LIST -->
    <section>

        <h2>Danh sách đánh giá</h2>

        <div id="subjectList"></div>

    </section>

    <script type="module" src="hoatdong.js"></script>

</body>
</html>
