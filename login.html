<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="shape blue"></div>
    <div class="shape orange"></div>

    <div class="glass-panel">
        <h2>Login</h2>

        <form id="register-form">
            <div class="input-group">
                <label>Username</label>
                <input type="email" id="reg-email" placeholder="Email or Phone" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Password" required>
            </div>

            <button type="button" class="btn-primary" id="btn-register">Login</button>
        </form>

        <div class="social-buttons">
            <button class="btn-social">
                G Google
            </button>
            <button class="btn-social">
                f Facebook
            </button>
        </div>

        <div class="footer-text">
            Don't have an account? <a href="register.html">Sign Up Here</a>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
