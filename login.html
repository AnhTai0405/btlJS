<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="shape blue"></div>
    <div class="shape orange"></div>

    <div class="glass-panel">
        <h2>Login</h2>
        <form id="login-form">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="Email của bạn..." required>
            </div>

            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="login-password" placeholder="Mật khẩu..." required>
            </div>

            <button type="submit" class="btn-primary" id="btn-login">Login</button>
        </form>

        <div class="social-buttons">
            <button class="btn-social">G Google</button>
            <button class="btn-social">f Facebook</button>
        </div>

        <div class="footer-text">
            Don't have an account? <a href="register.html">Sign Up Here</a>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
