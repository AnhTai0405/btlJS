<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="shape blue"></div>
    <div class="shape orange"></div>

    <div class="glass-panel">
        <h2>Create Account</h2>
        <form id="register-form">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="register-email" placeholder="Nhập Email..." required>
            </div>

            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="register-password" placeholder="Nhập Mật khẩu..." required>
            </div>

            <button type="submit" class="btn-primary" id="btn-register">Create Account</button>
        </form>

        <div class="social-buttons">
            <button class="btn-social">G Google</button>
            <button class="btn-social">f Facebook</button>
        </div>

        <div class="footer-text">
            Have an account? <a href="login.html">Login Here</a>
        </div>
    </div>

    <script type="module" src="register.js"></script>
</body>
</html>
